<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="360" fill="#0d1117"/>
  <text x="30" y="46" fill="#f0f6fc" font-size="26" font-weight="bold">GPU Aspect: CUDA Workflow (built, host-validated, no GPU on this VM)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/></marker>
  </defs>
  <g font-size="15" fill="#f0f6fc">
    <rect x="30" y="90" width="200" height="90" rx="10" fill="#1f6feb"/>
    <text x="130" y="128" text-anchor="middle">ComputeEngine</text>
    <text x="130" y="152" text-anchor="middle" font-size="13" fill="#c9d8f2">backend probe at start</text>
    <rect x="280" y="90" width="200" height="90" rx="10" fill="#238636"/>
    <text x="380" y="122" text-anchor="middle">CUDA kernel</text>
    <text x="380" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">device SHA-256, grid scan</text>
    <text x="380" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">Toolkit 12.9, compiles</text>
    <rect x="530" y="90" width="220" height="90" rx="10" fill="#238636"/>
    <text x="640" y="122" text-anchor="middle">Host-side validation</text>
    <text x="640" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">abc vector, genesis hash</text>
    <text x="640" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">49,907 hits in 100k nonces</text>
    <rect x="800" y="90" width="330" height="90" rx="10" fill="#b62324"/>
    <text x="965" y="122" text-anchor="middle">Runtime verdict on this VM</text>
    <text x="965" y="146" text-anchor="middle" font-size="13" fill="#f7d9d9">CUDA error 35: no device present</text>
    <text x="965" y="166" text-anchor="middle" font-size="13" fill="#f7d9d9">zero GPU hashes claimed, ever</text>
    <rect x="530" y="230" width="220" height="90" rx="10" fill="#9e6a03"/>
    <text x="640" y="268" text-anchor="middle">CPU fallback engages</text>
    <text x="640" y="292" text-anchor="middle" font-size="13" fill="#f2e3c9">same API, C engine mines</text>
    <rect x="280" y="230" width="200" height="90" rx="10" fill="#6e40c9"/>
    <text x="380" y="268" text-anchor="middle">On GPU hardware</text>
    <text x="380" y="292" text-anchor="middle" font-size="13" fill="#e3d9f7">same kernel runs unmodified</text>
  </g>
  <g stroke="#58a6ff" stroke-width="3" fill="none">
    <line x1="230" y1="135" x2="272" y2="135" marker-end="url(#arr)"/>
    <line x1="480" y1="135" x2="522" y2="135" marker-end="url(#arr)"/>
    <line x1="750" y1="135" x2="792" y2="135" marker-end="url(#arr)"/>
    <line x1="965" y1="180" x2="700" y2="222" marker-end="url(#arr)"/>
    <line x1="530" y1="275" x2="488" y2="275" marker-end="url(#arr)"/>
  </g>
</svg>
