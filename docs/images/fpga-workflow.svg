<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="360" fill="#0d1117"/>
  <text x="30" y="46" fill="#f0f6fc" font-size="26" font-weight="bold">FPGA Aspect: RTL Workflow (simulated and synthesized, no board attached)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/></marker>
  </defs>
  <g font-size="15" fill="#f0f6fc">
    <rect x="30" y="90" width="200" height="90" rx="10" fill="#1f6feb"/>
    <text x="130" y="122" text-anchor="middle">sha256_core.v</text>
    <text x="130" y="146" text-anchor="middle" font-size="13" fill="#c9d8f2">iterative core</text>
    <text x="130" y="166" text-anchor="middle" font-size="13" fill="#c9d8f2">64 rounds, 1 per clock</text>
    <rect x="280" y="90" width="200" height="90" rx="10" fill="#1f6feb"/>
    <text x="380" y="122" text-anchor="middle">sha256d_miner.v</text>
    <text x="380" y="146" text-anchor="middle" font-size="13" fill="#c9d8f2">double hash, nonce FSM</text>
    <text x="380" y="166" text-anchor="middle" font-size="13" fill="#c9d8f2">midstate in, winner out</text>
    <rect x="530" y="90" width="220" height="90" rx="10" fill="#238636"/>
    <text x="640" y="122" text-anchor="middle">Icarus testbench</text>
    <text x="640" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">FIPS abc vector passes</text>
    <text x="640" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">genesis nonce 2083236893 found</text>
    <rect x="800" y="90" width="200" height="90" rx="10" fill="#238636"/>
    <text x="900" y="122" text-anchor="middle">Yosys synthesis</text>
    <text x="900" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">xc7 generic target</text>
    <text x="900" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">2,659 LUTs, 6,233 cells</text>
    <rect x="800" y="230" width="200" height="90" rx="10" fill="#9e6a03"/>
    <text x="900" y="268" text-anchor="middle">Rate estimate</text>
    <text x="900" y="292" text-anchor="middle" font-size="13" fill="#f2e3c9">137 cycles per hash, 0.73 MH/s</text>
    <rect x="530" y="230" width="220" height="90" rx="10" fill="#b62324"/>
    <text x="640" y="268" text-anchor="middle">Physical board</text>
    <text x="640" y="292" text-anchor="middle" font-size="13" fill="#f7d9d9">none attached, nothing claimed</text>
  </g>
  <g stroke="#58a6ff" stroke-width="3" fill="none">
    <line x1="230" y1="135" x2="272" y2="135" marker-end="url(#arr)"/>
    <line x1="480" y1="135" x2="522" y2="135" marker-end="url(#arr)"/>
    <line x1="750" y1="135" x2="792" y2="135" marker-end="url(#arr)"/>
    <line x1="900" y1="180" x2="900" y2="222" marker-end="url(#arr)"/>
    <line x1="800" y1="275" x2="758" y2="275" marker-end="url(#arr)"/>
  </g>
</svg>
