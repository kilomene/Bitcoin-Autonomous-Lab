<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="360" fill="#0d1117"/>
  <text x="30" y="46" fill="#f0f6fc" font-size="26" font-weight="bold">ASIC Aspect: Gate-Level Workflow (pre-layout design package)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/></marker>
  </defs>
  <g font-size="15" fill="#f0f6fc">
    <rect x="30" y="90" width="200" height="90" rx="10" fill="#1f6feb"/>
    <text x="130" y="128" text-anchor="middle">Same proven RTL</text>
    <text x="130" y="152" text-anchor="middle" font-size="13" fill="#c9d8f2">fpga miner sources</text>
    <rect x="280" y="90" width="200" height="90" rx="10" fill="#238636"/>
    <text x="380" y="122" text-anchor="middle">Yosys plus ABC</text>
    <text x="380" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">generic CMOS mapping</text>
    <text x="380" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">11,131 cells total</text>
    <rect x="530" y="90" width="220" height="90" rx="10" fill="#238636"/>
    <text x="640" y="122" text-anchor="middle">Gate-level simulation</text>
    <text x="640" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">identical testbench</text>
    <text x="640" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">genesis nonce found again</text>
    <rect x="800" y="90" width="200" height="90" rx="10" fill="#9e6a03"/>
    <text x="900" y="122" text-anchor="middle">Size estimate</text>
    <text x="900" y="146" text-anchor="middle" font-size="13" fill="#f2e3c9">about 25,000 gate equiv.</text>
    <text x="900" y="166" text-anchor="middle" font-size="13" fill="#f2e3c9">from cell counts, stated weights</text>
    <rect x="800" y="230" width="200" height="90" rx="10" fill="#b62324"/>
    <text x="900" y="262" text-anchor="middle">Not done, by design</text>
    <text x="900" y="286" text-anchor="middle" font-size="13" fill="#f7d9d9">no PDK, no place and route,</text>
    <text x="900" y="304" text-anchor="middle" font-size="13" fill="#f7d9d9">no tapeout, nothing claimed</text>
    <rect x="530" y="230" width="220" height="90" rx="10" fill="#6e40c9"/>
    <text x="640" y="268" text-anchor="middle">Next with a PDK</text>
    <text x="640" y="292" text-anchor="middle" font-size="13" fill="#e3d9f7">timing closure, then layout</text>
  </g>
  <g stroke="#58a6ff" stroke-width="3" fill="none">
    <line x1="230" y1="135" x2="272" y2="135" marker-end="url(#arr)"/>
    <line x1="480" y1="135" x2="522" y2="135" marker-end="url(#arr)"/>
    <line x1="750" y1="135" x2="792" y2="135" marker-end="url(#arr)"/>
    <line x1="900" y1="180" x2="900" y2="222" marker-end="url(#arr)"/>
    <line x1="800" y1="275" x2="758" y2="275" marker-end="url(#arr)"/>
  </g>
</svg>
