<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="360" fill="#0d1117"/>
  <text x="30" y="46" fill="#f0f6fc" font-size="26" font-weight="bold">CPU Aspect: Mining Workflow (LIVE on mainnet)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/></marker>
  </defs>
  <g font-size="15" fill="#f0f6fc">
    <rect x="30" y="90" width="200" height="90" rx="10" fill="#1f6feb"/>
    <text x="130" y="128" text-anchor="middle">Block template</text>
    <text x="130" y="152" text-anchor="middle" font-size="13" fill="#c9d8f2">GBT or Stratum job</text>
    <rect x="280" y="90" width="200" height="90" rx="10" fill="#238636"/>
    <text x="380" y="128" text-anchor="middle">Midstate snapshot</text>
    <text x="380" y="152" text-anchor="middle" font-size="13" fill="#d2ecd8">first 64 bytes hashed once</text>
    <rect x="530" y="90" width="220" height="90" rx="10" fill="#238636"/>
    <text x="640" y="122" text-anchor="middle">C batch engine, SHA-NI</text>
    <text x="640" y="146" text-anchor="middle" font-size="13" fill="#d2ecd8">2 threads tuned live</text>
    <text x="640" y="166" text-anchor="middle" font-size="13" fill="#d2ecd8">about 5.2M hashes per second</text>
    <rect x="800" y="90" width="200" height="90" rx="10" fill="#238636"/>
    <text x="900" y="128" text-anchor="middle">Early-exit search</text>
    <text x="900" y="152" text-anchor="middle" font-size="13" fill="#d2ecd8">stops at first valid nonce</text>
    <rect x="800" y="230" width="200" height="90" rx="10" fill="#9e6a03"/>
    <text x="900" y="268" text-anchor="middle">Verify in Python</text>
    <text x="900" y="292" text-anchor="middle" font-size="13" fill="#f2e3c9">hashlib cross-check</text>
    <rect x="530" y="230" width="220" height="90" rx="10" fill="#9e6a03"/>
    <text x="640" y="268" text-anchor="middle">Share or block found</text>
    <text x="640" y="292" text-anchor="middle" font-size="13" fill="#f2e3c9">difficulty 41.35 accepted</text>
    <rect x="280" y="230" width="200" height="90" rx="10" fill="#6e40c9"/>
    <text x="380" y="268" text-anchor="middle">Submit</text>
    <text x="380" y="292" text-anchor="middle" font-size="13" fill="#e3d9f7">Stratum share / submitblock</text>
    <rect x="30" y="230" width="200" height="90" rx="10" fill="#6e40c9"/>
    <text x="130" y="268" text-anchor="middle">Pool or Core accepts</text>
    <text x="130" y="292" text-anchor="middle" font-size="13" fill="#e3d9f7">accepted: true, on record</text>
  </g>
  <g stroke="#58a6ff" stroke-width="3" fill="none">
    <line x1="230" y1="135" x2="272" y2="135" marker-end="url(#arr)"/>
    <line x1="480" y1="135" x2="522" y2="135" marker-end="url(#arr)"/>
    <line x1="750" y1="135" x2="792" y2="135" marker-end="url(#arr)"/>
    <line x1="900" y1="180" x2="900" y2="222" marker-end="url(#arr)"/>
    <line x1="800" y1="275" x2="758" y2="275" marker-end="url(#arr)"/>
    <line x1="530" y1="275" x2="488" y2="275" marker-end="url(#arr)"/>
    <line x1="280" y1="275" x2="238" y2="275" marker-end="url(#arr)"/>
  </g>
</svg>
